<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>立体図形学習ツール（展開図＆クイズ機能統合版）</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f2f5; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 100; width: 230px; }
        
        /* 学習・クイズ切り替えタブ */
        .main-mode-toggle { display: flex; margin-bottom: 10px; gap: 5px; }
        .main-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #ddd; color: #333; }
        .main-btn.active { background: #333; color: white; }

        select { width: 100%; padding: 8px; margin-bottom: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        
        .mode-btn { width: 100%; padding: 10px; margin: 4px 0; border: 2px solid #ccc; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        #btn-v { background: #fff0f0; color: #cc0000; }
        #btn-e { background: #f0f8ff; color: #0066cc; }
        #btn-f { background: #f0fff0; color: #008800; }
        #btn-r { background: #fff5e6; color: #cc6600; margin-top: 10px; }
        
        .active { border-color: #333 !important; transform: scale(1.03); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .disabled { opacity: 0.3; pointer-events: none; filter: grayscale(100%); background: #ddd !important; border-color: #ccc !important; }

        .control-group { margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee; }
        .toggle-btn { width: 100%; padding: 10px; margin-bottom: 5px; background: #666; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .reset-btn { width: 100%; padding: 10px; background: #444; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* 展開図ボタン */
        .net-btn { width: 100%; padding: 12px; margin-top: 5px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .net-btn:hover { background: #e68900; }

        .number-label { position: absolute; font-size: 24px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white; transform: translate(-50%, -50%); z-index: 10; }

        /* クイズ用パネル */
        #quizPanel { display: none; margin-top: 10px; padding: 10px; background: #f0fff4; border: 2px solid #28a745; border-radius: 8px; }
        #quizMsg { margin-top: 8px; font-weight: bold; color: #155724; min-height: 1.2em; font-size: 14px; }

        /* 展開図モーダル */
        #netOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        #netContainer { background: white; padding: 20px; border-radius: 15px; max-width: 90%; max-height: 90%; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #netCanvas { width: 100%; max-width: 500px; height: auto; }
        .close-btn { margin-top: 15px; padding: 10px 30px; background: #333; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <div class="main-mode-toggle">
        <button id="main-study" class="main-btn active" onclick="setMainMode('study')">学習</button>
        <button id="main-quiz" class="main-btn" onclick="setMainMode('quiz')">クイズ</button>
    </div>

    <select id="shapeSelect">
        <optgroup label="角錐・角柱">
            <option value="triPyramid">三角錐</option>
            <option value="quadPyramid">四角錐</option>
            <option value="rectPrism">直方体</option>
            <option value="cube">立方体</option>
            <option value="triPrism">三角柱</option>
            <option value="quadPrism">四角柱</option>
        </optgroup>
        <optgroup label="円錐・円柱">
            <option value="cone">円錐</option>
            <option value="cylinder">円柱</option>
        </optgroup>
    </select>

    <div id="studyControls">
        <button id="btn-v" class="mode-btn active" onclick="setMode('v')">● 頂点</button>
        <button id="btn-e" class="mode-btn" onclick="setMode('e')">― 辺</button>
        <button id="btn-f" class="mode-btn" onclick="setMode('f')">■ 面</button>
        <button id="btn-r" class="mode-btn" onclick="setMode('r')">🔍 垂直・平行 (辺)</button>
    </div>

    <div id="quizPanel">
        <div id="quizQuestion" style="font-size:15px; font-weight:bold; color:#2c3e50;"></div>
        <div id="quizMsg"></div>
    </div>

    <div class="control-group">
        <button id="styleBtn" class="toggle-btn" onclick="toggleStyle()">表示: 実体 (白)</button>
        <button class="reset-btn" onclick="resetCount()">全部リセット</button>
        <button class="net-btn" id="netBtn" onclick="showNet()">📐 展開図を見る</button>
    </div>
</div>

<div id="netOverlay" onclick="closeNet(event)">
    <div id="netContainer" onclick="event.stopPropagation()">
        <h2 id="netTitle" style="margin: 0 0 15px 0; color: #333;">展開図</h2>
        <div id="svgContainer"></div>
        <button class="close-btn" onclick="closeNet(event)">閉じる</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

<script>
    var scene, camera, renderer, labelRenderer, controls, raycaster;
    var currentGroup, interactiveObjects = { v: [], e: [], f: [] };
    var mode = 'v', mainMode = 'study';
    var counters = { v: 0, e: 0, f: 0 };
    var isTransparent = false; 
    var quizRefEdge = null, quizRelationType = '', quizRemainingCount = 0;

    const faceColors = [
        0xff5555, 0x55ff55, 0x5555ff, 0xffff55, 
        0xff55ff, 0x55ffff, 0xffaa55, 0xaa55ff, 
        0x55ffaa, 0xffaaaa, 0xaaffaa, 0xaaaaff
    ];

    window.onload = function() { init(); animate(); };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f2f5);
        
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 9);
        
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);
        
        labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        raycaster = new THREE.Raycaster();
        raycaster.params.Line.threshold = 0.2;
        
        var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        var hemiLight = new THREE.HemisphereLight(0xffffff, 0xdddddd, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        var dirLight1 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight1.position.set(10, 10, 10);
        scene.add(dirLight1);
        var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-10, 5, -10);
        scene.add(dirLight2);

        document.getElementById('shapeSelect').onchange = function(e) { updateShape(e.target.value); };
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('resize', onWindowResize);
        
        updateShape('triPyramid');
    }

    function setMainMode(m) {
        if (mainMode === m) return;
        mainMode = m;
        document.getElementById('main-study').classList.toggle('active', m === 'study');
        document.getElementById('main-quiz').classList.toggle('active', m === 'quiz');
        
        document.getElementById('studyControls').style.display = (m === 'study') ? 'block' : 'none';
        document.getElementById('quizPanel').style.display = (m === 'quiz') ? 'block' : 'none';
        document.getElementById('netBtn').style.display = (m === 'study') ? 'block' : 'none';

        resetCount();
    }

    function setMode(m) {
        if (mode === m) return;
        mode = m;
        var btns = document.getElementsByClassName('mode-btn');
        for(var i=0; i<btns.length; i++) btns[i].classList.remove('active');
        document.getElementById('btn-' + m).classList.add('active');
        
        resetCount(); // 透明度リセット用
    }

    function toggleStyle() {
        isTransparent = !isTransparent;
        var btn = document.getElementById('styleBtn');
        if (isTransparent) {
            btn.textContent = "表示: 透明 (枠のみ)";
            btn.style.background = "#0088cc";
        } else {
            btn.textContent = "表示: 実体 (白)";
            btn.style.background = "#666";
        }
        updateShape(document.getElementById('shapeSelect').value);
    }

    function updateShape(type) {
        var btnV = document.getElementById('btn-v');
        var btnE = document.getElementById('btn-e');
        var btnF = document.getElementById('btn-f');
        var btnR = document.getElementById('btn-r');
        btnV.classList.remove('disabled');
        btnE.classList.remove('disabled');
        btnF.classList.remove('disabled');
        btnR.classList.remove('disabled');

        var needsModeChange = false;
        var newMode = mode;
        if (type === 'cylinder') {
            btnV.classList.add('disabled');
            btnE.classList.add('disabled');
            btnR.classList.add('disabled');
            if(mode === 'v' || mode === 'e' || mode === 'r') { needsModeChange = true; newMode = 'f'; }
        } else if (type === 'cone') {
            btnE.classList.add('disabled');
            btnR.classList.add('disabled');
            if(mode === 'e' || mode === 'r') { needsModeChange = true; newMode = 'v'; }
        }
        if (needsModeChange) {
            mode = newMode;
            var btns = document.getElementsByClassName('mode-btn');
            for(var i=0; i<btns.length; i++) btns[i].classList.remove('active');
            document.getElementById('btn-' + newMode).classList.add('active');
        }

        var oldLabels = document.getElementsByClassName('number-label');
        while(oldLabels.length > 0){ oldLabels[0].parentNode.removeChild(oldLabels[0]); }

        if (currentGroup) {
            scene.remove(currentGroup);
            currentGroup.traverse(function(obj) {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            });
        }
        currentGroup = new THREE.Group();
        interactiveObjects = { v: [], e: [], f: [] };
        counters = { v: 0, e: 0, f: 0 };

        var geom;
        var h = 3;
        var isSmooth = (type === 'cone' || type === 'cylinder');
        var segments = isSmooth ? 64 : 4; 

        if (type === 'triPyramid') geom = new THREE.TetrahedronGeometry(2);
        else if (type === 'quadPyramid') geom = new THREE.ConeGeometry(2, h, 4);
        else if (type === 'rectPrism') geom = new THREE.BoxGeometry(4, 2, 2.5);
        else if (type === 'cube') geom = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        else if (type === 'triPrism') geom = new THREE.CylinderGeometry(1.5, 1.5, h, 3);
        else if (type === 'quadPrism') geom = new THREE.CylinderGeometry(1.5, 1.5, h, 4);
        else if (type === 'cone') geom = new THREE.ConeGeometry(2, h, segments);
        else if (type === 'cylinder') geom = new THREE.CylinderGeometry(1.5, 1.5, h, segments);

        if(!isSmooth) geom = geom.toNonIndexed(); 

        var baseMaterial;
        var forceTransparent = (mainMode === 'quiz' || mode === 'r');
        if (isTransparent) {
            baseMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false });
        } else if (forceTransparent) {
            baseMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
        } else {
            baseMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: false, opacity: 1.0, side: THREE.FrontSide, specular: 0x111111, shininess: 10, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
        }
        
        var baseMesh = new THREE.Mesh(geom, baseMaterial);
        baseMesh.userData = { clickedFacesNormals: [], shapeType: type };
        currentGroup.add(baseMesh);
        interactiveObjects.f = [baseMesh];

        var wireMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
        
        if (isSmooth) {
            var r = (type === 'cone') ? 2 : 1.5;
            var lineGeo = new THREE.BufferGeometry().setFromPoints(new THREE.Path().absarc(0, 0, r, 0, Math.PI * 2).getSpacedPoints(64));
            var bottomLine = new THREE.LineLoop(lineGeo, wireMat);
            bottomLine.rotation.x = Math.PI / 2;
            bottomLine.position.y = -h / 2;
            currentGroup.add(bottomLine);

            if (type === 'cylinder') {
                var topLine = bottomLine.clone();
                topLine.position.y = h / 2;
                currentGroup.add(topLine);
            }
        } else {
            var wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geom), wireMat);
            currentGroup.add(wireframe);
            
            var edgePoints = new THREE.EdgesGeometry(geom).attributes.position;
            for(var i=0; i<edgePoints.count; i+=2) {
                var start = new THREE.Vector3(edgePoints.getX(i), edgePoints.getY(i), edgePoints.getZ(i));
                var end = new THREE.Vector3(edgePoints.getX(i+1), edgePoints.getY(i+1), edgePoints.getZ(i+1));
                var mid = start.clone().lerp(end, 0.5);
                // スマホでタップしやすいよう当たり判定を0.12に設定
                var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, start.distanceTo(end)), new THREE.MeshBasicMaterial({ color: 0x0066cc, transparent: true, opacity: 0.0 }));
                bar.position.copy(mid); bar.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), end.clone().sub(start).normalize());
                // クイズ機能に必要な start, end を追加
                bar.userData = { type: 'e', clicked: false, start: start, end: end }; 
                currentGroup.add(bar); interactiveObjects.e.push(bar);
            }
        }

        if (type !== 'cylinder') {
            var vPoints = [];
            if (type === 'cone') {
                vPoints.push(new THREE.Vector3(0, h/2, 0));
            } else {
                var pos = geom.attributes.position;
                for(var i=0; i<pos.count; i++) {
                    var v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
                    var isCenterAxis = Math.abs(v.x) < 0.05 && Math.abs(v.z) < 0.05;
                    var isPyramidTip = type.indexOf('Pyramid') !== -1 && v.y > 0;
                    if (isCenterAxis && !isPyramidTip) continue;
                    vPoints.push(v);
                }
            }
            var vSet = [];
            for(var k=0; k<vPoints.length; k++) {
                var v = vPoints[k];
                var exists = false;
                for(var j=0; j<vSet.length; j++) { if(vSet[j].distanceTo(v) < 0.1) exists = true; }
                if(!exists) {
                    vSet.push(v);
                    var dotColor = isTransparent ? 0xbbbbbb : 0xcccccc;
                    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: dotColor}));
                    dot.position.copy(v); dot.userData = { type: 'v', clicked: false };
                    currentGroup.add(dot); interactiveObjects.v.push(dot);
                }
            }
        }
        scene.add(currentGroup);
    }

    function onPointerDown(e) {
        if (e.target.tagName !== 'CANVAS') return;
        var mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        raycaster.setFromCamera(mouse, camera);

        // クイズモード
        if (mainMode === 'quiz') {
            var hits = raycaster.intersectObjects(interactiveObjects.e);
            if (hits.length > 0) handleQuizClick(hits[0].object);
            return;
        }

        // 垂直・平行モード
        if (mode === 'r') {
            var hits = raycaster.intersectObjects(interactiveObjects.e);
            if (hits.length > 0) analyzeRelations(hits[0].object);
            return;
        }
        
        var btnId = 'btn-' + mode;
        if(document.getElementById(btnId) && document.getElementById(btnId).classList.contains('disabled')) return;

        var targets = (mode === 'v') ? interactiveObjects.v : (mode === 'e' ? interactiveObjects.e : interactiveObjects.f);
        var intersects = raycaster.intersectObjects(targets);

        if (intersects.length > 0) {
            var hit = intersects[0];
            if ((mode === 'v' || mode === 'e') && hit.object.userData.clicked) return;

            if (mode === 'f') {
                var mesh = hit.object;
                var clickedNormal = hit.face.normal.clone().normalize();
                var shapeType = document.getElementById('shapeSelect').value;
                var isSmooth = (shapeType === 'cone' || shapeType === 'cylinder');
                var isSideFace = isSmooth && (Math.abs(clickedNormal.y) < 0.9);
                
                var alreadyClicked;
                // 修正ポイント： distanceTo を < 0.01 から < 0.1 に緩和し、同じ面の微小な位置ズレを許容
                if(isSideFace) alreadyClicked = mesh.userData.clickedFacesNormals.includes("side");
                else alreadyClicked = mesh.userData.clickedFacesNormals.some(function(n) { return (typeof n !== 'string') && n.distanceTo(clickedNormal) < 0.1; });
                
                if (alreadyClicked) return;

                if(isSideFace) mesh.userData.clickedFacesNormals.push("side");
                else mesh.userData.clickedFacesNormals.push(clickedNormal);

                counters[mode]++;
                var colorIndex = (counters[mode] - 1) % faceColors.length;
                var selectedColor = faceColors[colorIndex];
                
                var paintMaterial = isTransparent 
                    ? new THREE.MeshBasicMaterial({ color: selectedColor, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
                    : new THREE.MeshBasicMaterial({ color: selectedColor, transparent: false, side: THREE.DoubleSide });

                var highlightMesh;
                if (isSmooth) {
                    var r = (shapeType === 'cone') ? 2 : 1.5;
                    var h = 3;
                    if (isSideFace) {
                        var segments = 64;
                        var sideGeom;
                        if (shapeType === 'cone') sideGeom = new THREE.ConeGeometry(r, h, segments, 1, true); 
                        else sideGeom = new THREE.CylinderGeometry(r, r, h, segments, 1, true); 
                        highlightMesh = new THREE.Mesh(sideGeom, paintMaterial);
                        if(!isTransparent) highlightMesh.scale.set(1.01, 1.01, 1.01);
                    } else {
                        var circleGeom = new THREE.CircleGeometry(r, 64);
                        highlightMesh = new THREE.Mesh(circleGeom, paintMaterial);
                        if (clickedNormal.y > 0.9) {
                            highlightMesh.rotation.x = -Math.PI / 2;
                            highlightMesh.position.set(0, h/2, 0);
                            if(!isTransparent) highlightMesh.position.y += 0.01;
                        } else {
                            highlightMesh.rotation.x = Math.PI / 2;
                            highlightMesh.position.set(0, -h/2, 0);
                            if(!isTransparent) highlightMesh.position.y -= 0.01;
                        }
                    }
                } else {
                    var highlightGeom = new THREE.BufferGeometry();
                    var vertices = [];
                    var posAttr = mesh.geometry.attributes.position;
                    for (var i = 0; i < posAttr.count; i += 3) {
                        var vA = new THREE.Vector3().fromBufferAttribute(posAttr, i);
                        var vB = new THREE.Vector3().fromBufferAttribute(posAttr, i+1);
                        var vC = new THREE.Vector3().fromBufferAttribute(posAttr, i+2);
                        var cb = new THREE.Vector3().subVectors(vC, vB);
                        var ab = new THREE.Vector3().subVectors(vA, vB);
                        var normal = cb.cross(ab).normalize();
                        if (normal.distanceTo(clickedNormal) < 0.1) {
                            vertices.push(vA.x, vA.y, vA.z, vB.x, vB.y, vB.z, vC.x, vC.y, vC.z);
                        }
                    }
                    highlightGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    highlightMesh = new THREE.Mesh(highlightGeom, paintMaterial);
                    if (!isTransparent) highlightMesh.position.add(clickedNormal.clone().multiplyScalar(0.01));
                }
                currentGroup.add(highlightMesh);
            } else {
                hit.object.userData.clicked = true;
                counters[mode]++;
                if (mode === 'v') hit.object.material.color.set(0xff4444);
                if (mode === 'e') { hit.object.material.opacity = 1.0; hit.object.material.color.set(0x4444ff); }
            }
            
            // ラベル表示（いただいたコードそのまま）
            var div = document.createElement('div');
            div.className = 'number-label';
            div.textContent = counters[mode];
            div.style.color = (mode === 'v') ? '#cc0000' : (mode === 'e' ? '#0066cc' : '#008800');
            var label = new THREE.CSS2DObject(div);
            var labelPos = hit.point.clone();
            if(mode === 'f') {
                 if(hit.object.geometry.type.includes("Cone") || hit.object.geometry.type.includes("Cylinder")) labelPos.add(hit.face.normal.clone().multiplyScalar(0.5));
                 else labelPos.add(hit.face.normal.clone().multiplyScalar(0.3));
            } else {
                labelPos.normalize().multiplyScalar(0.2).add(hit.point);
            }
            label.position.copy(labelPos);
            currentGroup.add(label);
        }
    }
    
    // --- クイズと関係性のロジック ---
 function handleQuizClick(hit) {
     // 【追加】すでに全部見つけてクリアしている場合は、クリックしても反応しないようにする
 if (quizRemainingCount <= 0) return;

 if (hit === quizRefEdge || hit.userData.clicked) return;

 if (hit.userData.isAnswer) {
 hit.userData.clicked = true;
hit.material.color.set(0x28a745);
hit.material.opacity = 1;
 quizRemainingCount--;
  
if (quizRemainingCount > 0) {
 document.getElementById('quizMsg').textContent = "正解！まだありますよ。";
 document.getElementById('quizMsg').style.color = "#28a745";
 } else {
// 【変更】自動で次へ進む setTimeout を削除し、メッセージを変更
 document.getElementById('quizMsg').innerHTML = "よく見つけましたね！🎉<br>「全部リセット」で次の問題へ";
 document.getElementById('quizMsg').style.color = "#007bff";
 // setTimeout(startRelationQuiz, 2000); ←この行を削除しました
 }
 } else {
 document.getElementById('quizMsg').textContent = "それは関係が違いますね。";
 document.getElementById('quizMsg').style.color = "#dc3545";
}
 }


    function startRelationQuiz() {
        var type = document.getElementById('shapeSelect').value;
        if (type === 'cone' || type === 'cylinder') {
            document.getElementById('quizQuestion').textContent = "この図形には辺がありません。";
            document.getElementById('quizMsg').textContent = "";
            return;
        }
        if (!interactiveObjects.e || interactiveObjects.e.length === 0) return;
        quizRefEdge = interactiveObjects.e[Math.floor(Math.random() * interactiveObjects.e.length)];
        quizRefEdge.material.color.set(0x000000);
        quizRefEdge.material.opacity = 1;
        const types = ['垂直', '平行', 'ねじれの位置'];
        quizRelationType = types[Math.floor(Math.random() * types.length)];
        quizRemainingCount = 0;
        const rV = new THREE.Vector3().subVectors(quizRefEdge.userData.end, quizRefEdge.userData.start).normalize();
        interactiveObjects.e.forEach(edge => {
            if (edge === quizRefEdge) return;
            const tV = new THREE.Vector3().subVectors(edge.userData.end, edge.userData.start).normalize();
            const dot = Math.abs(rV.dot(tV));
            const shares = (quizRefEdge.userData.start.distanceTo(edge.userData.start) < 0.1 || quizRefEdge.userData.start.distanceTo(edge.userData.end) < 0.1 || quizRefEdge.userData.end.distanceTo(edge.userData.start) < 0.1 || quizRefEdge.userData.end.distanceTo(edge.userData.end) < 0.1);
            let isMatch = (quizRelationType === '平行' && dot > 0.95) || (quizRelationType === '垂直' && dot < 0.05 && shares) || (quizRelationType === 'ねじれの位置' && !shares && dot < 0.95);
            edge.userData.isAnswer = isMatch;
            edge.userData.clicked = false;
            if (isMatch) quizRemainingCount++;
        });
        document.getElementById('quizQuestion').innerHTML = `黒い辺に対して<br><b style="color:#d35400;">【${quizRelationType}】</b>な辺を選ぼう！`;
        document.getElementById('quizMsg').textContent = "";
    }

    function analyzeRelations(ref) {
        const rV = new THREE.Vector3().subVectors(ref.userData.end, ref.userData.start).normalize();
        interactiveObjects.e.forEach(edge => {
            edge.material.opacity = 0.3; edge.material.color.set(0xcccccc);
            if (edge === ref) { edge.material.opacity = 1; edge.material.color.set(0x000000); return; }
            const tV = new THREE.Vector3().subVectors(edge.userData.end, edge.userData.start).normalize();
            const dot = Math.abs(rV.dot(tV));
            const shares = (ref.userData.start.distanceTo(edge.userData.start) < 0.1 || ref.userData.start.distanceTo(edge.userData.end) < 0.1 || ref.userData.end.distanceTo(edge.userData.start) < 0.1 || ref.userData.end.distanceTo(edge.userData.end) < 0.1);
            if (dot > 0.95) edge.material.color.set(0x3399ff);
            else if (dot < 0.05 && shares) edge.material.color.set(0xff3333);
            else if (!shares && dot < 0.95) edge.material.color.set(0xffaa00);
            edge.material.opacity = 1;
        });
    }

    function resetCount() { 
        updateShape(document.getElementById('shapeSelect').value); 
        if (mainMode === 'quiz') startRelationQuiz();
    }
    
    function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight); }
    function animate() { requestAnimationFrame(animate); if(controls) controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); }

    // --- 展開図機能 ---
    function showNet() {
        var type = document.getElementById('shapeSelect').value;
        var svgHTML = generateNetSVG(type);
        document.getElementById('svgContainer').innerHTML = svgHTML;
        document.getElementById('netOverlay').style.display = 'flex';
    }

    function closeNet(e) {
        document.getElementById('netOverlay').style.display = 'none';
    }

    function generateNetSVG(type) {
        var s = '<svg viewBox="0 0 300 300" width="100%" height="100%" style="overflow:visible;">';
        var style = 'fill="none" stroke="#333" stroke-width="2" fill="rgba(0,136,204,0.1)"';
        
        if(type === 'cube') {
            s += `<path d="M100,50 h50 v50 h50 v50 h-50 v50 h-50 v-50 h-50 v-50 h50 z" ${style} />`;
            s += '<path d="M100,100 h50 M100,150 h50 M100,100 v50 M150,100 v50" stroke="#999" stroke-width="1" stroke-dasharray="4" />';
        } else if(type === 'rectPrism') {
            s += `<path d="M100,30 h50 v50 h50 v80 h-50 v50 h-50 v-50 h-40 v-80 h40 z" ${style} />`;
            s += '<line x1="100" y1="80" x2="150" y2="80" stroke="#999" stroke-dasharray="4"/>';
            s += '<line x1="100" y1="160" x2="150" y2="160" stroke="#999" stroke-dasharray="4"/>';
            s += '<line x1="100" y1="80" x2="100" y2="160" stroke="#999" stroke-dasharray="4"/>';
            s += '<line x1="150" y1="80" x2="150" y2="160" stroke="#999" stroke-dasharray="4"/>';
        } else if(type === 'triPrism') {
            s += `<rect x="70" y="80" width="50" height="100" ${style} />`;
            s += `<rect x="120" y="80" width="50" height="100" ${style} />`;
            s += `<rect x="170" y="80" width="50" height="100" ${style} />`;
            s += `<polygon points="120,80 170,80 145,36" ${style} />`;
            s += `<polygon points="120,180 170,180 145,224" ${style} />`;
        } else if(type === 'quadPrism') {
            s += `<rect x="80" y="50" width="60" height="200" ${style} />`;
            s += '<line x1="80" y1="100" x2="140" y2="100" stroke="#333" stroke-width="2"/>';
            s += '<line x1="80" y1="150" x2="140" y2="150" stroke="#333" stroke-width="2"/>';
            s += '<line x1="80" y1="200" x2="140" y2="200" stroke="#333" stroke-width="2"/>';
            s += `<rect x="20" y="100" width="60" height="50" ${style} />`;
            s += `<rect x="140" y="100" width="60" height="50" ${style} />`;
        } else if(type === 'triPyramid') {
            s += `<polygon points="150,50 50,220 250,220" ${style} />`;
            s += `<polygon points="150,220 100,135 200,135" stroke="#999" stroke-dasharray="4" fill="none"/>`;
        } else if(type === 'quadPyramid') {
            s += `<rect x="110" y="110" width="80" height="80" ${style} />`;
            s += `<polygon points="110,110 190,110 150,30" ${style} />`;
            s += `<polygon points="190,110 190,190 270,150" ${style} />`;
            s += `<polygon points="190,190 110,190 150,270" ${style} />`;
            s += `<polygon points="110,190 110,110 30,150" ${style} />`;
        } else if(type === 'cylinder') {
            s += `<rect x="50" y="80" width="200" height="100" ${style} />`;
            s += `<circle cx="150" cy="45" r="30" ${style} />`;
            s += `<circle cx="150" cy="215" r="30" ${style} />`;
        } else if(type === 'cone') {
            s += `<path d="M150,150 L250,150 A100,100 0 0,0 63,100 Z" ${style} />`; 
            s += `<circle cx="150" cy="235" r="35" ${style} />`;
        }

        s += '</svg>';
        return s;
    }
</script>
